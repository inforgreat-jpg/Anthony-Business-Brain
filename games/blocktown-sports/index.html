<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;800&family=Noto+Sans+TC:wght@500;800&display=swap">
<style>
/* Layout: a blocky sports town. Sky above, grass-and-dirt ground strip, chunky bevelled "block" panels. Single deliberate daytime look. */
:root{
  --sky1:#7cc8f5; --sky2:#d6efff;
  --grass:#5dbb3f; --grass-dk:#3e8d2a;
  --dirt:#8a5a32; --dirt-dk:#664120;
  --wood:#c48a52; --wood-dk:#8f5d31;
  --stone:#8b8f98; --stone-lt:#c9ccd3;
  --paper:#fffaf0; --ink:#1d261b; --ink-soft:#4f5a4b;
  --gold:#f6c22d; --gold-dk:#c08d12;
  --p1:#22a99e; --p2:#ff8638;
  --heart:#e2453c; --warn:#f0a020; --good:#3fae3a;
  --court:#3a78b5; --sand:#e8cf8e;
  --font-display:"Pixelify Sans","Noto Sans TC",ui-monospace,monospace;
  --font-body:"Nunito","Noto Sans TC",system-ui,sans-serif;
  --bevel:inset -4px -4px 0 rgba(0,0,0,.22), inset 4px 4px 0 rgba(255,255,255,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(var(--sky1),var(--sky2) 70%);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:17px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
.ground{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:0;pointer-events:none;
  background:
    linear-gradient(var(--grass) 0 14px, var(--grass-dk) 14px 18px, transparent 18px),
    repeating-linear-gradient(90deg,var(--dirt) 0 24px,var(--dirt-dk) 24px 28px);
}
.ground::before{content:"";position:absolute;inset:0 0 auto 0;height:14px;background:repeating-linear-gradient(90deg,transparent 0 20px,rgba(255,255,255,.18) 20px 24px)}
main{position:relative;z-index:1}

/* block primitives */
.block{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--bevel),0 6px 0 rgba(29,38,27,.25);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 18px;border:3px solid var(--ink);background:var(--stone-lt);box-shadow:var(--bevel);font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.1;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.2)}
.btn.go{background:var(--grass);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold)}
.btn.wood{background:var(--wood);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.btn.small{min-height:40px;font-size:16px;padding:4px 12px}
.tile[disabled]{opacity:.5;cursor:not-allowed}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.say{min-width:44px;min-height:44px;border:3px solid var(--ink);background:#fff;box-shadow:var(--bevel);font-size:20px;padding:0;flex:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.words{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.word{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;padding:4px 10px 5px;border:2px solid var(--ink);background:#fff3c4;box-shadow:inset -3px -3px 0 rgba(0,0,0,.12);line-height:1.15;text-align:left}
.word b{font-family:var(--font-display);font-size:20px}
.word small{font-size:13px;font-weight:800;color:var(--ink-soft)}

.spread{justify-content:space-between}
.muted{color:var(--ink-soft)}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--wood);border:3px solid var(--ink);box-shadow:var(--bevel);color:#fff;margin-bottom:16px}
.topbar h1{font-size:22px;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.topbar .grow{flex:1;min-width:0}
.sync{font-size:13px;font-weight:800;padding:3px 8px;background:rgba(0,0,0,.25)}

/* home */
.hero{text-align:center;padding-block:24px 8px}
.hero h1{font-size:clamp(30px,6vw,52px);color:#fff;text-shadow:4px 4px 0 var(--ink)}
.hero p{font-family:var(--font-display);font-size:22px;margin:10px 0 0;color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:24px}
.kid{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px;border:3px solid var(--ink);box-shadow:var(--bevel),0 8px 0 rgba(29,38,27,.3);background:var(--paper)}
.kid .face{width:120px;height:120px;image-rendering:pixelated;border:3px solid var(--ink)}
.kid .nm{font-family:var(--font-display);font-size:32px}
.kid.p1{border-top:12px solid var(--p1)} .kid.p2{border-top:12px solid var(--p2)}
.homeLinks{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* hub */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.sec h2{font-size:22px}
.sec .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec .head h2{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:3px solid var(--ink);background:var(--gold);font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--ink)}
.piggy{display:flex;align-items:center;gap:14px}
.piggy .big{font-size:44px;line-height:1}
.coins{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-width:320px}
.gb{width:22px;height:22px;background:var(--gold);border:2px solid var(--gold-dk);box-shadow:inset -3px -3px 0 rgba(0,0,0,.15),inset 3px 3px 0 rgba(255,255,255,.5)}
.cn{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--gold-dk);align-self:center}
.energy{display:flex;gap:6px;margin:6px 0 12px}
.energy i{width:24px;height:24px;border:2px solid var(--ink);background:var(--gold);font-style:normal;display:grid;place-items:center;font-size:14px}
.energy i.off{background:var(--stone-lt);opacity:.5}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:3px solid var(--ink);background:#fff;box-shadow:var(--bevel);text-align:center;min-width:0}
.tile .em{font-size:44px;line-height:1.1;width:72px;height:72px;display:grid;place-items:center;background:linear-gradient(var(--grass) 0 12px,var(--dirt) 12px);border:3px solid var(--ink)}
.tile .t{font-weight:800;line-height:1.2}
.tile .s{font-size:14px;color:var(--ink-soft)}
.tile.locked .em{filter:grayscale(.8);opacity:.7}
.hp{width:100%;height:16px;border:2px solid var(--ink);background:#eee;position:relative}
.hp b{position:absolute;inset:0 auto 0 0;background:var(--good)}
.hp.mid b{background:var(--warn)} .hp.low b{background:var(--heart)}
.vault .bar{height:34px;border:3px solid var(--ink);background:#fff;display:flex;overflow:hidden}
.vault .bar span{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);vertical-align:-2px;margin-right:4px}
.shopRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.levels span{padding:3px 8px;border:2px solid var(--ink);font-size:14px;font-weight:800;background:#fff;opacity:.45}
.levels span.on{opacity:1;background:var(--gold)}

/* modal + games */
.veil{position:fixed;inset:0;z-index:10;background:rgba(20,30,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(720px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--paper);border:4px solid var(--ink);box-shadow:var(--bevel),0 10px 0 rgba(0,0,0,.3);padding:18px}
.dlg h2{font-size:24px}
.dlg .head{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.dlg .head h2{flex:1;min-width:0}
.center{text-align:center}
.burst{font-size:64px;line-height:1.1}
.arena{position:relative;width:100%;height:min(52vh,420px);border:4px solid var(--ink);overflow:hidden;touch-action:manipulation;user-select:none}
.arena.court{background:linear-gradient(90deg,transparent calc(50% - 2px),#fff calc(50% - 2px) calc(50% + 2px),transparent 0),linear-gradient(transparent 12%,#fff 12% calc(12% + 4px),transparent 0 calc(88% - 4px),#fff calc(88% - 4px) 88%,transparent 0),var(--court)}
.arena.sand{background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.35) 0 2px,transparent 3px) 0 0/22px 22px,var(--sand)}
.arena.field{background:repeating-linear-gradient(90deg,#57b33b 0 40px,#4ea535 40px 80px)}
.arena.grass{background:repeating-linear-gradient(0deg,#4aa832 0 30px,#43982d 30px 60px)}
.tgt{position:absolute;display:grid;place-items:center;border:0;background:transparent;padding:0;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3))}
.tgt.drift{animation:drift 2.4s ease-in-out infinite alternate}
.tgt.pop{animation:pop .25s forwards}
@keyframes drift{from{margin-left:-14px}to{margin-left:14px}}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.prog{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.prog i{width:18px;height:18px;border:2px solid var(--ink);background:#fff}
.prog i.on{background:var(--gold)}
.order{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:20px}
.fan{display:flex;align-items:center;gap:10px;font-size:64px}
.bubble{font-size:52px;background:#fff;border:3px solid var(--ink);padding:6px 14px;box-shadow:var(--bevel)}
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choices button{font-size:52px;width:96px;height:96px;border:3px solid var(--ink);background:#fff;box-shadow:var(--bevel)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.days{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.day{border:3px solid var(--ink);background:#fff;padding:8px 12px;display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start}
.day .dn{font-family:var(--font-display);font-weight:700}
.day ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;min-width:0}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.compare>div{border:3px solid var(--ink);padding:10px;background:#fff;text-align:center}
.field-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field-row label{font-weight:800}
input[type=text],select{font:inherit;min-height:48px;padding:6px 10px;border:3px solid var(--ink);background:#fff;width:100%}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px}
.seg button.sel{background:var(--gold)}
.float{position:fixed;z-index:30;font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--gold);text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:floatUp 1s forwards}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}

/* board */
.kids2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{border:2px solid var(--ink);padding:8px;background:#fff}
.stat b{display:block;font-family:var(--font-display);font-size:22px}
.stat small{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0;border-bottom:3px solid var(--ink);margin-top:8px}
.chart .wk{flex:1;display:flex;gap:3px;align-items:flex-end;height:100%;min-width:0}
.chart .wk span{flex:1;min-height:2px;border:2px solid var(--ink);border-bottom:0}
.xl{display:flex;gap:10px;padding:4px 4px 0}
.xl span{flex:1;text-align:center;font-size:12px;color:var(--ink-soft);min-width:0}
.c-work{background:var(--wood)} .c-biz{background:var(--gold)}
.q{border-left:6px solid var(--gold);background:#fff;padding:8px 12px;margin:8px 0}
.q small{display:block;color:var(--ink-soft)}
.log{font-size:15px;margin:0;padding-left:18px}
@media (max-width:520px){.day{grid-template-columns:1fr}.stat{grid-template-columns:1fr 1fr}.topbar h1{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const DAYN = {en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], zh:["週日","週一","週二","週三","週四","週五","週六"]};

// ---------- state ----------
const S = {
  mode:"local", db:null, ready:false,
  players:{p1:null, p2:null}, team:null,
  ui:{screen:"home", pid:null}, queue:[], game:null, confirmReset:false, flash:null

const LS_KEY = "blocktown-sports-v1";

function defaultPlayer(id){
  return {id, name: id==="p1" ? "Carlo" : "Nene", lang:"zh", diff: id==="p1" ? "hard" : "easy",
    auto: id!=="p1", cash:0, given:0, spent:0, workTotal:0, bizTotal:0, level:"worker",

// ---------- helpers ----------
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function L(lang, key, v){ let s = (T[lang]||T.en)[key] ?? T.en[key] ?? key; if(v) for(const k in v) s = s.split("{"+k+"}").join(v[k]); return s; }
function P(){ return S.players[S.ui.pid]; }
function tl(key, v){ const p = P(); return L(p ? p.lang : "en", key, v); }
function nm(obj, lang){ return obj[lang] || obj.en; }
function sib(pid){ return pid === "p1" ? "p2" : "p1"; }

function dstr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pdate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); }
function addDays(s, n){ const d = pdate(s); d.setDate(d.getDate()+n); return dstr(d); }
function diffDays(a, b){ return Math.round((pdate(b) - pdate(a)) / 86400000); }
function today(){ return addDays(dstr(new Date()), (S.team && S.team.dayOffset) || 0); }
function weekKey(s){ const d = pdate(s); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return dstr(d); }
function dayLabel(s, lang){ const d = pdate(s); return DAYN[lang][d.getDay()] + " " + (d.getMonth()+1) + "/" + d.getDate(); }
function hash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h>>>0) % 10000) / 10000; }

function levelOf(p){
  if (BIZ_IDS.some(b => p.biz[b])) return "owner";
  if (p.given > 0 || p.cash + p.given >= 20) return "saver";
  return "worker";
}
function vaultTotal(){ const a = S.players.p1, b = S.players.p2; const sum = (a?a.given:0) + (b?b.given:0); return S.team && S.team.built ? Math.max(0, sum - GOAL) : sum; }
function shiftsUsed(p){ return p.shifts.date === today() ? p.shifts.n : 0; }
function bumpWeek(p, date, field, n){ const k = weekKey(date); p.weeks[k] = p.weeks[k] || {w:0, b:0}; p.weeks[k][field] += n;
  const keys = Object.keys(p.weeks).sort(); while (keys.length > 16) delete p.weeks[keys.shift()]; }
function hpClass(h){ return h >= 70 ? "" : h >= 40 ? "mid" : "low"; }
function careFactor(h){ return h >= 70 ? 1 : h >= 40 ? 0.7 : 0.4; }

// ---------- sound + speech ----------
let actx = null;
function blip(freq=660, len=0.08){
  if (S.team && S.team.sound === false) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.06, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + len);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + len); } catch(e) {}
}
function isCantonese(v){ return /yue|zh[-_]hk|hong ?kong|cantonese|粵|粤|廣東|广东/i.test((v.lang||"")+" "+(v.name||"")); }
function pickVoice(lang){
  try { const vs = speechSynthesis.getVoices(); const norm = x => (x||"").replace("_","-").toLowerCase();
    const want = lang === "zh" ? ["zh-cn","cmn-cn","cmn-hans","zh-hans","zh-sg","zh-tw","cmn-tw","cmn","zh"] : ["en-us","en-gb","en"];
    for (const w of want) { const v = vs.find(v => norm(v.lang).startsWith(w) && !isCantonese(v)); if (v) return v; } } catch(e) {}
  return null;
}
// Traditional -> Simplified map for the characters this game uses, so Mandarin voices read them as mainland Mandarin
const T2S_T = "乾來個們儲動員單團報場塊夠學將幫幾庫後從態撿擁攤時會東樂樣歲沒淨測為爾狀獎現盃稱簡約級給網練習聲腳補裡覺設試語誰讀變貨買資賺賽載這週過還錢錯鎮長閃開闆關隊難顧餓體麼", T2S_S = "干来个们储动员单团报场块够学将帮几库后从态捡拥摊时会东乐样岁没净测为尔状奖现杯称简约级给网练习声脚补里觉设试语谁读变货买资赚赛载这周过还钱错镇长闪开板关队难顾饿体么";
const toSimp = t => [...t].map(c => { const i = T2S_T.indexOf(c); return i < 0 ? c : T2S_S[i]; }).join("");
function speak(text, lang){
  try { if (!("speechSynthesis" in window)) return false; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance((lang === "zh" ? toSimp(text) : text).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ""));
    u.lang = lang === "zh" ? "zh-CN" : "en-US"; const v = pickVoice(lang); if (v) u.voice = v; u.rate = 0.9;
    speechSynthesis.speak(u); return !!v || true; } catch(e) { return false; }
}
try { if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {}; } catch(e) {}
function wordChips(keys, lang){
  return `<div class="words">${keys.map(k => { const w = WORDS[k], a = lang === "zh" ? w.zh : w.en, b = lang === "zh" ? w.en : w.zh;
    return `<button class="word" data-act="word" data-k="${k}" aria-label="${esc(w.zh+" "+w.en)}"><b>${esc(a)}</b><small>${esc(b)}</small></button>`; }).join("")}</div>`;
}
function speakBoth(w){
  try { if (!("speechSynthesis" in window)) return; speechSynthesis.cancel();
    const mk = (text, lang) => { const u = new SpeechSynthesisUtterance(lang === "zh" ? toSimp(text) : text);
      u.lang = lang === "zh" ? "zh-CN" : "en-US"; const v = pickVoice(lang); if (v) u.voice = v; u.rate = 0.85; return u; };
    speechSynthesis.speak(mk(w.zh, "zh")); speechSynthesis.speak(mk(w.en, "en")); } catch(e) {}
}
function sayBtn(text, lang){ return `<button class="say" data-act="say" data-text="${esc(text)}" data-lang="${lang}" aria-label="${esc(L(lang,"tooltipSay"))}" title="${esc(L(lang,"tooltipSay"))}">🔊</button>`; }
function autoSay(text){ const p = P(); if (p && p.auto) speak(text, p.lang); }

// ---------- pixel avatar ----------
const FACE = ["HHHHHHHH","BBBBBBBB","HSSSSSSH","SSSSSSSS","SWKSSKWS","SSSNNSSS","SSMMMMSS","SSSSSSSS"];
const faceCache = {};
function faceURL(pid){
  if (faceCache[pid]) return faceCache[pid];
  const pal = {H:"#3b2a1f", B:KID_COLORS[pid], S:"#e9b98d", W:"#ffffff", K:"#2b2b52", N:"#c98f66", M:"#9a4a3a"};
  const c = document.createElement("canvas"); c.width = c.height = 8; const g = c.getContext("2d");
  FACE.forEach((row,y) => [...row].forEach((ch,x) => { g.fillStyle = pal[ch]; g.fillRect(x,y,1,1); }));
  return (faceCache[pid] = c.toDataURL());
}

// ---------- persistence ----------
const chains = {};
function persist(path, data){
  if (S.mode === "db" && S.db) {
    const body = clone(data);
    chains[path] = (chains[path] || Promise.resolve()).then(() => S.db.doc(path).set(body)).catch(err => {
      console.warn("save failed", path, err && err.code);
      if (err && err.code === "unavailable") return new Promise(r => setTimeout(r, 800 + Math.random()*800)).then(() => S.db.doc(path).set(body)).catch(()=>{});
    });
  } else {
    try { localStorage.setItem(LS_KEY, JSON.stringify({players:S.players, team:S.team})); } catch(e) {}
  }
}
const savePlayer = p => persist("players/" + p.id, p);
const saveTeam = () => persist("team/main", S.team);
function addLog(en, zh){ S.team.log.unshift({d: today(), en, zh}); S.team.log = S.team.log.slice(0, 30); saveTeam(); }

function loadLocal(){
  let data = null; try { data = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch(e) {}
  S.players.p1 = (data && data.players && data.players.p1) || defaultPlayer("p1");
  S.players.p2 = (data && data.players && data.players.p2) || defaultPlayer("p2");
  S.team = (data && data.team) || defaultTeam();
  S.ready = true; render();
}

async function boot(){
  render();
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e) { db = null; }
  if (!db) { S.mode = "local"; loadLocal(); return; }
  S.mode = "db"; S.db = db;
  const seen = {p1:false, p2:false, team:false};
  const check = () => { if (!S.ready && seen.p1 && seen.p2 && seen.team) { S.ready = true; } render(); };
  const sub = (path, key, make) => db.doc(path).onSnapshot(snap => {
    if (!snap.exists) { const d = make(); if (key === "team") S.team = d; else S.players[key] = d; persist(path, d); }
    else { const d = clone(snap.data()); if (key === "team") S.team = Object.assign(defaultTeam(), d); else S.players[key] = Object.assign(defaultPlayer(key), d); }
    seen[key] = true; check();
  }, err => { console.warn("sync stopped", err && err.code); if (!S.ready) { S.mode = "local"; loadLocal(); } });
  sub("players/p1", "p1", () => defaultPlayer("p1"));
  sub("players/p2", "p2", () => defaultPlayer("p2"));
  sub("team/main", "team", defaultTeam);
  setTimeout(() => { if (!S.ready) { S.mode = "local"; loadLocal(); } }, 12000);
}

// ---------- time passing ----------
function tick(p){
  const now = today();
  if (!p.lastTick) { p.lastTick = now; savePlayer(p); return null; }
  let n = diffDays(p.lastTick, now);
  if (n <= 0) return null;
  const capped = Math.min(n, 60), start = addDays(now, -capped);
  const days = []; let total = 0; const piggyBefore = p.cash;
  for (let i = 1; i <= capped; i++) {
    const d = addDays(start, i); const items = [];
    for (const b of BIZ_IDS) {
      const st = p.biz[b]; if (!st) continue;
      const r = hash(p.id + b + d);
      const ev = r < 0.15 ? "bad" : r > 0.85 ? "great" : "normal";
      const evf = ev === "bad" ? 0.3 : ev === "great" ? 1.6 : 1;
      const inc = Math.max(0, Math.round(BIZ[b].base * careFactor(st.health) * evf));
      items.push({b, inc, ev, h: st.health});
      st.earned = (st.earned || 0) + inc; total += inc; bumpWeek(p, d, "b", inc);
      st.health = Math.max(10, st.health - DECAY);
    }
    days.push({d, items});
  }
  p.cash += total; p.bizTotal += total; p.lastTick = now;
  const owned = BIZ_IDS.some(b => p.biz[b]);
  if (owned || piggyBefore > 0) {
    // keep the replay until this kid opens their own profile, even if Dad or a sibling advanced the clock
    const prev = p.replay;
    p.replay = prev ? {n: prev.n + n, days: prev.days.concat(days).slice(-60), total: prev.total + total, piggyBefore: prev.piggyBefore, owned: prev.owned || owned}
                    : {n, days, total, piggyBefore, owned};
  }
  savePlayer(p);
  return p.replay || null;
}
function tickAll(){ for (const id of ["p1","p2"]) if (S.players[id]) tick(S.players[id]); }

function checkLevel(p){
  const lv = levelOf(p);
  if (LEVELS.indexOf(lv) > LEVELS.indexOf(p.level || "worker")) { p.level = lv; savePlayer(p); S.queue.push({type:"level", lv}); }
}

// ---------- render ----------
function render(){
  const app = document.getElementById("app");
  if (S.game) return; // games manage their own DOM in the layer
  if (!S.ready) { app.innerHTML = `<div class="hero"><h1>Blocktown Sports</h1><p>${esc(L("en","loading"))}<br>${esc(L("zh","loading"))}</p></div>`; return; }
  if (S.ui.screen === "home") app.innerHTML = homeView();
  else if (S.ui.screen === "hub") app.innerHTML = hubView();
  else if (S.ui.screen === "board") app.innerHTML = boardView();
  renderLayer();
}

      <div><div style="font-size:36px">🐷😴</div><b>${esc(L(lang,"sleeping"))}</b><div class="num" style="font-size:22px">${esc(L(lang,"still",{n:r.piggyBefore}))}</div></div></div>

// ---------- mini-games ----------
function startGame(kind, id, ownerPid){
  const p = P(), lang = p.lang, easy = p.diff === "easy";
  let cfg;
  if (kind === "job") { const j = JOBS[id]; cfg = {kind, id, type:j.type, target:j.target, bg:j.bg, title:nm(j.title,lang), instr:nm(j.instr,lang), icon:j.emoji}; }
  else { const B = BIZ[id]; cfg = {kind, id, ownerPid, type:"tap", target:B.fixTarget, bg:B.bg, title:nm(B.name,lang), instr:nm(B.fix,lang), icon:"🔧"}; }
  cfg.count = cfg.type === "order" ? (easy ? 6 : 8) : kind === "fix" ? (easy ? 6 : 8) : (easy ? 8 : 12);
  cfg.done = 0; S.game = cfg;
  const layer = document.getElementById("layer");
  layer.innerHTML = `<div class="veil"><div class="dlg" role="dialog" aria-modal="true">
    <div class="head"><h2>${cfg.icon} ${esc(cfg.title)}</h2>${sayBtn(cfg.instr, lang)}</div>
    <p style="margin:0 0 6px;font-size:20px"><b>${esc(cfg.instr)}</b></p>
    <div class="prog" id="prog">${Array.from({length:cfg.count},()=>"<i></i>").join("")}</div>
    <div id="stage"></div></div></div>`;
  autoSay(cfg.instr);
  if (cfg.type === "tap") setupTap(cfg, easy); else setupOrder(cfg, easy, lang);
}
function setupTap(cfg, easy){
  const stage = document.getElementById("stage");
  stage.innerHTML = `<div class="arena ${cfg.bg}" id="arena"></div>`;
  const arena = document.getElementById("arena");
  const cols = 5, rows = 4, cells = []; for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) cells.push([c,r]);
  cells.sort(() => Math.random() - 0.5);
  const size = easy ? 60 : 46;
  cells.slice(0, cfg.count).forEach(([c,r], i) => {
    const b = document.createElement("button"); b.className = "tgt" + (easy ? "" : " drift"); b.textContent = cfg.target;
    b.style.left = ((c + 0.5 + (Math.random()-0.5)*0.4) / cols * 100) + "%";
    b.style.top = ((r + 0.5 + (Math.random()-0.5)*0.4) / rows * 100) + "%";
    b.style.fontSize = size + "px"; b.style.width = b.style.height = (size + 16) + "px"; b.style.animationDelay = (-i*0.37) + "s";
    b.setAttribute("aria-label", cfg.target);
    b.addEventListener("click", () => { if (b.dataset.hit) return; b.dataset.hit = 1; b.classList.remove("drift"); b.classList.add("pop"); blip(520 + cfg.done*40); progress(cfg); setTimeout(() => b.remove(), 260); });
    arena.appendChild(b);
  });
}
function setupOrder(cfg, easy, lang){
  const items = easy ? ["🌭","🥤"] : ["🌭","🥤","🍿"];
  const fans = ["🧒","👧","👦","👩","👨","🧓","👵"];
  const stage = document.getElementById("stage");
  const next = () => {
    if (cfg.done >= cfg.count) return;
    const want = items[Math.floor(Math.random()*items.length)], fan = fans[Math.floor(Math.random()*fans.length)];
    stage.innerHTML = `<div class="arena field" style="height:auto"><div class="order">
      <div class="fan"><span>${fan}</span><span class="bubble">${want}</span></div>
      <div class="row"><b style="color:#fff;text-shadow:2px 2px 0 #000;font-size:20px">${esc(L(lang,"whatWant"))}</b></div>
      <div class="choices">${items.map(it => `<button data-it="${it}" aria-label="${it}">${it}</button>`).join("")}</div></div></div>`;
    stage.querySelectorAll(".choices button").forEach(btn => btn.addEventListener("click", () => {
      if (btn.dataset.it === want) { blip(700); progress(cfg); setTimeout(next, 250); }
      else { blip(180, .15); btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake"); }
    }));
  };
  next();
}
function progress(cfg){
  cfg.done++;
  const pips = document.querySelectorAll("#prog i"); if (pips[cfg.done-1]) pips[cfg.done-1].classList.add("on");
  if (cfg.done >= cfg.count) setTimeout(() => finishGame(cfg), 350);
}
function finishGame(cfg){
  const p = P(), lang = p.lang; let body = "";
  if (cfg.kind === "job") {
    p.cash += PAY; p.workTotal += PAY; bumpWeek(p, today(), "w", PAY);
    const t = today(); p.shifts = {date:t, n: shiftsUsed(p) + 1}; savePlayer(p); checkLevel(p);
    [880,1040,1320].forEach((f,i) => setTimeout(() => blip(f,.1), i*110));
    const msg = L(lang,"paid",{n:PAY}); autoSay(msg);
    const left = SHIFTS - shiftsUsed(p);
    body = `<div class="burst">💵</div><div class="head" style="justify-content:center"><h2>${esc(msg)}</h2>${sayBtn(msg,lang)}</div>
      <p class="num" style="font-size:22px">🐷 $${p.cash}</p>${coinsHTML(PAY, true).replace('class="coins"','class="coins" style="justify-content:center;margin-inline:auto"')}
      <div class="row" style="justify-content:center;margin-top:14px">${left>0?`<button class="btn go" data-act="jobAgain" data-job="${cfg.id}">${esc(L(lang,"again"))}</button>`:""}<button class="btn" data-act="endGame">${esc(L(lang,"toTown"))}</button></div>`;
  } else {
    const owner = S.players[cfg.ownerPid]; const st = owner.biz[cfg.id];
    st.health = Math.min(100, st.health + FIX_GAIN); savePlayer(owner);
    if (owner.id !== p.id) addLog(`${p.name} helped take care of ${owner.name}'s ${BIZ[cfg.id].name.en}.`, `${p.name}幫${owner.name}照顧了${BIZ[cfg.id].name.zh}。`);
    [660,880].forEach((f,i) => setTimeout(() => blip(f,.1), i*110));
    const msg = L(lang,"fixed",{n:st.health}); autoSay(msg + " " + L(lang,"ownerWork"));
    body = `<div class="burst">🔧✨</div><div class="head" style="justify-content:center"><h2>${esc(msg)}</h2>${sayBtn(msg+" "+L(lang,"ownerWork"),lang)}</div>
      ${hpBar(st.health)}<p>${esc(owner.id===p.id ? L(lang,"ownerWork") : L(lang,"helpSub"))}</p>
      <div class="row" style="justify-content:center">${st.health<100?`<button class="btn go" data-act="fixAgain" data-biz="${cfg.id}" data-owner="${owner.id}">🔧 ${esc(L(lang,"fixIt"))}</button>`:""}<button class="btn" data-act="endGame">${esc(L(lang,"toTown"))}</button></div>`;
  }
  document.querySelector("#layer .dlg").innerHTML = `<div class="center">${body}</div>`;
}
function endGame(){ S.game = null; document.getElementById("layer").innerHTML = ""; render(); }

// ---------- actions ----------
function floatText(txt, el){ const r = el.getBoundingClientRect(); const f = document.createElement("div"); f.className = "float"; f.textContent = txt;
  f.style.left = (r.left + r.width/2 - 30) + "px"; f.style.top = (r.top) + "px"; document.body.appendChild(f); setTimeout(() => f.remove(), 1000); }

function openPlayer(pid){
  S.ui = {screen:"hub", pid}; S.queue = [];
  const p = P(); tick(p); const r = p.replay;
  if (r) { S.queue.push({type:"sleep", r}); delete p.replay; savePlayer(p); }
  const o = S.players[sib(pid)]; if (o) tick(o);
  checkLevel(p);
  render(); window.scrollTo(0,0);
  if (r) autoSay(r.owned ? `${L(p.lang,"sleepBiz",{n:r.total})} ${L(p.lang,"lesson")}` : L(p.lang,"noBiz"));
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, p = P();
  switch (act) {
    case "say": speak(el.dataset.text, el.dataset.lang); break;
    case "word": { const w = WORDS[el.dataset.k]; if (w) { speakBoth(w); blip(990,.05); } break; }
    case "open": openPlayer(el.dataset.pid); break;
    case "home": S.ui = {screen:"home", pid:null}; S.queue = []; S.confirmReset = false; render(); break;
    case "board": S.ui = {screen:"board", pid:null}; tickAll(); render(); window.scrollTo(0,0); break;
    case "settings": S.queue.unshift({type:"settings"}); renderLayer(); break;
    case "next": S.queue.shift(); renderLayer(); break;
    case "job": if (shiftsUsed(p) < SHIFTS) startGame("job", el.dataset.job); break;
    case "jobAgain": S.game = null; if (shiftsUsed(p) < SHIFTS) startGame("job", el.dataset.job); else endGame(); break;
    case "fix": startGame("fix", el.dataset.biz, el.dataset.owner); break;
    case "fixAgain": S.game = null; startGame("fix", el.dataset.biz, el.dataset.owner); break;
    case "endGame": endGame(); break;
    case "buy": { const b = el.dataset.biz, B = BIZ[b]; if (p.cash < B.price || p.biz[b]) break;
      p.cash -= B.price; p.biz[b] = {health:100, earned:0, since:today()}; savePlayer(p);
      addLog(`${p.name} bought the ${B.name.en} for $${B.price}.`, `${p.name}花 $${B.price} 買下了${B.name.zh}。`);
      blip(880); const msg = L(p.lang,"boughtBiz",{b:nm(B.name,p.lang)});
      S.queue.push({type:"msg", icon:B.emoji+"🎉", text:msg, sub:L(p.lang,"ownerWork")}); checkLevel(p); render(); autoSay(msg); break; }
    case "give": { const n = Number(el.dataset.n); if (p.cash < n) break; p.cash -= n; p.given += n; savePlayer(p);
      addLog(`${p.name} put $${n} in the team vault.`, `${p.name}往團隊金庫存入了 $${n}。`);
      blip(760); floatText("+$"+n, el); checkLevel(p); render(); break; }
    case "buildPark": if (vaultTotal() >= GOAL && !S.team.built) { S.team.built = true; saveTeam();
      addLog("The kids built the Blocktown Ballpark together!", "孩子們一起建好了方塊鎮棒球場！");
      S.queue.push({type:"msg", icon:"🏟️🎉", text:L(p.lang,"built"), sub:L(p.lang,"stadiumMsg")}); render(); autoSay(L(p.lang,"built")); } break;
    case "shop": { const it = SHOP.find(s => s.id === el.dataset.item); if (!it || p.items.includes(it.id) || p.cash < it.price) break;
      p.cash -= it.price; p.spent += it.price; p.items.push(it.id); savePlayer(p);
      addLog(`${p.name} bought a ${it.en} for $${it.price}.`, `${p.name}花 $${it.price} 買了${it.zh}。`);
      blip(600); const msg = L(p.lang,"bought",{i:it[p.lang]||it.en});
      S.queue.push({type:"msg", icon:it.emoji, text:msg, sub:L(p.lang,"shopSub")}); render(); autoSay(msg + " " + L(p.lang,"shopSub")); break; }
    case "set": { let v = el.dataset.val; if (v === "true") v = true; else if (v === "false") v = false; p[el.dataset.field] = v; savePlayer(p); render(); break; }
    case "rename": { const v = (document.getElementById("nick").value || "").trim().slice(0,16); if (v) { p.name = v; savePlayer(p); render(); } break; }
    case "testVoice": { const v = pickVoice(p.lang); speak(L(p.lang,"voiceOk"), p.lang);
      const note = document.getElementById("voiceNote"); if (!note) break;
      if (v) note.textContent = "✅ " + v.name + " (" + v.lang + ")";
      else if (p.lang === "zh") { let canto = false; try { canto = speechSynthesis.getVoices().some(isCantonese); } catch(e) {}
        note.textContent = canto ? "⚠️ 這台平板只有粵語聲音。請在平板的「文字轉語音」設置裡下載「中文（中國）」普通話聲音。 Only a Cantonese voice is installed. Add a Chinese (China) Mandarin voice in the tablet's text-to-speech settings."
                                 : "⚠️ 沒有找到普通話聲音。請在平板的「文字轉語音」設置裡下載「中文（中國）」聲音。 No Mandarin voice found. Add a Chinese (China) voice in the tablet's text-to-speech settings."; }
      else note.textContent = "⚠️ No English voice found on this device."; break; }
    case "ffwd": S.team.dayOffset = (S.team.dayOffset||0) + 1; saveTeam(); tickAll(); render(); break;
    case "sound": S.team.sound = S.team.sound === false; saveTeam(); render(); break;
    case "reset": S.confirmReset = true; render(); break;
    case "resetNo": S.confirmReset = false; render(); break;
    case "resetYes": S.confirmReset = false; S.players.p1 = Object.assign(defaultPlayer("p1"), {name:S.players.p1.name, lang:S.players.p1.lang, diff:S.players.p1.diff, auto:S.players.p1.auto});
      S.players.p2 = Object.assign(defaultPlayer("p2"), {name:S.players.p2.name, lang:S.players.p2.lang, diff:S.players.p2.diff, auto:S.players.p2.auto});
      S.team = defaultTeam(); savePlayer(S.players.p1); savePlayer(S.players.p2); saveTeam(); render(); break;
  }
});

boot();
</script>
